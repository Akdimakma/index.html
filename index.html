<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clash Squad Web 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: Tahoma, sans-serif;
            color: #fff;
            touch-action: none;
        }
        /* نافذة المتجر */
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 20;
        }
        .hidden {
            display: none !important;
        }
        .btn {
            background-color: #f97316;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #ea580c;
        }

        /* أزرار التحكم باللمس للعبة 3D */
        .controls-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            z-index: 10;
        }
        .control-btn {
            background: rgba(249, 115, 22, 0.8);
            color: white;
            border: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .control-btn:active {
            background: rgba(234, 88, 12, 1);
            transform: scale(0.95);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* زر إطلاق النار */
        .action-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
        }
        .fire-btn {
            width: 80px;
            height: 80px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fire-btn:active {
            background: #dc2626;
            transform: scale(0.95);
        }

        /* شريط المعلومات العلوي أثناء القتال */
        #hud-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(30, 41, 59, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة المتجر -->
    <div id="shop-screen" class="container">
        <h2>مرحلة التجهيز (المتجر)</h2>
        <p>رصيدك الحالي: <span id="balance">3000</span> نقطة</p>
        <p>النتيجة الحالية: 1 - 2 | الجولة: 4</p>
        
        <div style="background: #334155; padding: 10px; border-radius: 8px; margin: 10px 0;">
            <h3>سلاح MP40 - السعر: 1500</h3>
            <button class="btn" onclick="buyItem(1500, 'MP40')">شراء</button>
        </div>

        <button class="btn" onclick="startCombat()">بدء الاشتباك 🚀</button>
    </div>

    <!-- 2. واجهة وأزرار المعركة 3D (تظهر بعد بدء الاشتباك) -->
    <div id="combat-ui" class="hidden">
        <div id="hud-info">⚔️ الجولة نشطة - السلاح: <span id="weapon-status">مسدس USP</span></div>

        <!-- أزرار الحركة باللمس -->
        <div class="controls-container">
            <button class="control-btn" id="btn-up">⬆️</button>
            <button class="control-btn" id="btn-left">⬅️</button>
            <button class="control-btn" id="btn-down">⬇️</button>
            <button class="control-btn" id="btn-right">➡️</button>
        </div>

        <!-- زر إطلاق النار -->
        <div class="action-container">
            <button class="fire-btn" id="btn-fire">🎯 إطلاق</button>
        </div>
    </div>

    <!-- استدعاء مكتبة Three.js للرسومات ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let playerGold = 3000;
        let hasMp40 = false;
        let combatStarted = false;

        // دالة الشراء في المتجر
        function buyItem(price, itemName) {
            if (playerGold >= price) {
                playerGold -= price;
                document.getElementById('balance').innerText = playerGold;
                hasMp40 = true;
                document.getElementById('weapon-status').innerText = itemName;
                alert('تم شراء ' + itemName + ' بنجاح!');
            } else {
                alert('رصيدك غير كافٍ!');
            }
        }

        let scene, camera, renderer, player;
        let moveX = 0, moveZ = 0;

        // الانتقال من المتجر إلى ساحة المعركة 3D
        function startCombat() {
            document.getElementById('shop-screen').classList.add('hidden');
            document.getElementById('combat-ui').classList.remove('hidden');
            combatStarted = true;
            init3D();
        }

        // إعداد مشهد الـ 3D
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // الإضاءة
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // الأرضية (الساحة)
            const floorGeometry = new THREE.PlaneGeometry(25, 25);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // مجسم اللاعب
            const playerGeometry = new THREE.BoxGeometry(1, 2, 1);
            const playerMaterial = new THREE.MeshStandardMaterial({ color: 0xf97316 });
            player = new THREE.Mesh(playerGeometry, playerMaterial);
            player.position.set(0, 1, 0);
            scene.add(player);

            // تفعيل أزرار التحكم باللمس
            setupTouchControls();

            // بدء حلقة الحركة والعرض
            animate();
        }

        // ربط أزرار الحركة واللمس
        function setupTouchControls() {
            const bindTouch = (id, xVal, zVal) => {
                const btn = document.getElementById(id);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveX = xVal; moveZ = zVal; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); moveX = 0; moveZ = 0; });
                // دعم الماوس أيضاً لتجربتها من الحاسوب
                btn.addEventListener('mousedown', () => { moveX = xVal; moveZ = zVal; });
                btn.addEventListener('mouseup', () => { moveX = 0; moveZ = 0; });
            };

            bindTouch('btn-up', 0, -0.1);
            bindTouch('btn-down', 0, 0.1);
            bindTouch('btn-left', -0.1, 0);
            bindTouch('btn-right', 0.1, 0);

            // زر إطلاق النار (يتغير لون اللاعب مؤقتاً عند الإطلاق بناءً على السلاح المشتري)
            document.getElementById('btn-fire').addEventListener('click', () => {
                let color = hasMp40 ? 0xef4444 : 0x3b82f6;
                player.material.color.set(color);
                setTimeout(() => player.material.color.set(0xf97316), 200);
            });
        }

        // حلقة التحديث المستمرة
        function animate() {
            if (!combatStarted) return;
            requestAnimationFrame(animate);

            // تحريك اللاعب
            player.position.x += moveX;
            player.position.z += moveZ;

            // تتبع الكاميرا للاعب
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 10;
            camera.lookAt(player.position);

            renderer.render(scene, camera);
        }

        // التكيف عند تدوير الشاشة
        window.addEventListener('resize', () => {
            if (!combatStarted) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
